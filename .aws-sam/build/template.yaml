AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Read-only Schwab portfolio drawdown and gain-floor monitor.
Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to the SNS alert topic.
  DrawdownThresholds:
    Type: String
    Default: 5,10,15,20
    Description: Comma-separated drawdown percentages.
  GainFloorPercent:
    Type: String
    Default: '15'
    Description: Alert when unrealized gain percentage drops below this value. Leave
      blank to disable.
  RecoveryBufferPercent:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Recovery required before a crossed threshold can alert again.
  MonitorSchedule:
    Type: String
    Default: cron(0/30 7-14 ? * MON-FRI *)
    Description: EventBridge Scheduler expression evaluated in ScheduleTimezone.
  ScheduleTimezone:
    Type: String
    Default: America/Denver
Conditions:
  HasAlertEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: AlertEmail
      - ''
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
    - arm64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AlertTopic:
    Type: AWS::SNS::Topic
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn:
        Ref: AlertTopic
      Protocol: email
      Endpoint:
        Ref: AlertEmail
  CallbackApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-callback-api
      ProtocolType: HTTP
  StartAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: StartAuthFunction
      Handler: start-auth.handler
      Description: Creates a one-time OAuth state and returns the Schwab authorization
        URL.
      Environment:
        Variables:
          STATE_TABLE_NAME:
            Ref: StateTable
          CLIENT_ID_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/client-id
          SCHWAB_REDIRECT_URI:
            Fn::Join:
            - ''
            - - https://
              - Ref: CallbackApi
              - .execute-api.
              - Ref: AWS::Region
              - .
              - Ref: AWS::URLSuffix
              - /oauth/callback
      Policies:
      - Statement:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/client-id
        - Effect: Allow
          Action: dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - StateTable
            - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/start-auth.ts
        Format: esm
        MainFields: module,main
        Minify: false
        OutExtension:
        - .js=.mjs
        Sourcemap: false
        Target: es2024
      SamResourceId: StartAuthFunction
  OAuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: OAuthCallbackFunction
      Handler: oauth-callback.handler
      Description: Public OAuth callback protected by one-time state validation.
      Environment:
        Variables:
          STATE_TABLE_NAME:
            Ref: StateTable
          CLIENT_ID_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/client-id
          CLIENT_SECRET_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/client-secret
          TOKEN_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/token-set
          SCHWAB_REDIRECT_URI:
            Fn::Join:
            - ''
            - - https://
              - Ref: CallbackApi
              - .execute-api.
              - Ref: AWS::Region
              - .
              - Ref: AWS::URLSuffix
              - /oauth/callback
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - ssm:GetParameter
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/client-id
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/client-secret
        - Effect: Allow
          Action: ssm:PutParameter
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/token-set
        - Effect: Allow
          Action: dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - StateTable
            - Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/oauth-callback.ts
        Format: esm
        MainFields: module,main
        Minify: false
        OutExtension:
        - .js=.mjs
        Sourcemap: false
        Target: es2024
      SamResourceId: OAuthCallbackFunction
  OAuthCallbackIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: CallbackApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      IntegrationUri:
        Fn::Join:
        - ''
        - - 'arn:'
          - Ref: AWS::Partition
          - ':apigateway:'
          - Ref: AWS::Region
          - :lambda:path/2015-03-31/functions/
          - Fn::GetAtt:
            - OAuthCallbackFunction
            - Arn
          - /invocations
  OAuthCallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: CallbackApi
      RouteKey: GET /oauth/callback
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: OAuthCallbackIntegration
  CallbackStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: CallbackApi
      StageName: $default
      AutoDeploy: true
  OAuthCallbackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: OAuthCallbackFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Join:
        - ''
        - - 'arn:'
          - Ref: AWS::Partition
          - ':execute-api:'
          - Ref: AWS::Region
          - ':'
          - Ref: AWS::AccountId
          - ':'
          - Ref: CallbackApi
          - /*/GET/oauth/callback
  MonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: MonitorFunction
      Handler: monitor.handler
      Description: Retrieves Schwab account values and evaluates portfolio thresholds.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          STATE_TABLE_NAME:
            Ref: StateTable
          ALERT_TOPIC_ARN:
            Ref: AlertTopic
          CLIENT_ID_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/client-id
          CLIENT_SECRET_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/client-secret
          TOKEN_PARAMETER:
            Fn::Sub: /${AWS::StackName}/schwab/token-set
          DRAWDOWN_THRESHOLDS:
            Ref: DrawdownThresholds
          GAIN_FLOOR_PERCENT:
            Ref: GainFloorPercent
          RECOVERY_BUFFER_PERCENT:
            Ref: RecoveryBufferPercent
      Events:
        PortfolioSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression:
              Ref: MonitorSchedule
            ScheduleExpressionTimezone:
              Ref: ScheduleTimezone
            FlexibleTimeWindow:
              Mode: false
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 900
      Policies:
      - Statement:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/client-id
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/client-secret
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/token-set
        - Effect: Allow
          Action: ssm:PutParameter
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/schwab/token-set
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - StateTable
            - Arn
        - Effect: Allow
          Action: sns:Publish
          Resource:
            Ref: AlertTopic
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/monitor.ts
        Format: esm
        MainFields: module,main
        Minify: false
        OutExtension:
        - .js=.mjs
        Sourcemap: false
        Target: es2024
      SamResourceId: MonitorFunction
  MonitorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Portfolio monitor failed on two consecutive evaluation periods.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: MonitorFunction
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
      OKActions:
      - Ref: AlertTopic
Outputs:
  CallbackUrl:
    Description: Register this exact callback URL in the Schwab developer portal.
    Value:
      Fn::Join:
      - ''
      - - https://
        - Ref: CallbackApi
        - .execute-api.
        - Ref: AWS::Region
        - .
        - Ref: AWS::URLSuffix
        - /oauth/callback
  StartAuthFunctionName:
    Description: Invoke this function with AWS IAM credentials to start OAuth.
    Value:
      Ref: StartAuthFunction
  MonitorFunctionName:
    Value:
      Ref: MonitorFunction
  AlertTopicArn:
    Value:
      Ref: AlertTopic
  ClientIdParameterName:
    Value:
      Fn::Sub: /${AWS::StackName}/schwab/client-id
  ClientSecretParameterName:
    Value:
      Fn::Sub: /${AWS::StackName}/schwab/client-secret
  TokenParameterName:
    Value:
      Fn::Sub: /${AWS::StackName}/schwab/token-set
